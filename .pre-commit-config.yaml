default_stages: [pre-commit]
default_language_version:
  node: system
fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: (tsconfig.json|API.md|.mergify.yml|.projen/|.github|tsconfig.dev.json|.gitignore|LICENSE|.gitattributes|.eslintrc.json|pnpm-workspace.yaml)
      - id: trailing-whitespace
        exclude: (pnpm-workspace.yaml)
      - id: check-json
        exclude: (tsconfig.json|.eslintrc.json|tsconfig.dev.json)
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
  - repo: https://github.com/talos-systems/conform
    rev: v0.1.0-alpha.26
    hooks:
      - id: conform
        stages:
          - commit-msg
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v2.7.1"
    hooks:
      - id: prettier
        exclude: (.mergify.yml|.projen/|.github|tsconfig.dev.json|.gitignore|LICENSE|.gitattributes|.eslintrc.json|pnpm-workspace.yaml)
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: projen
        name: run-projen
        language: system
        entry: sh -c 'npx projen'
        files: \.ts$
        pass_filenames: false
  - repo: local
    hooks:
      - id: build-typescript
        exclude: .projenrc.ts
        name: build-typescript
        language: system
        entry: sh -c 'npx tsc --noEmit'
        files: \.ts$
        pass_filenames: false
  - repo: local
    hooks:
      - id: synth
        name: synth
        language: system
        # Provider uses a prebuilt handler asset; build it before synth.
        entry: sh -c 'npx projen build:handler && npx cdk synth --quiet --context vpc-id=$VPC_ID'
        files: src/.*\.ts$
        pass_filenames: false
  - repo: local
    hooks:
      - id: compile-project
        exclude: .projenrc.ts
        name: compile-project
        language: system
        entry: sh -c 'npx projen compile'
        files: \.ts$
        pass_filenames: false
  - repo: local
    hooks:
      - id: test
        exclude: .projenrc.ts
        name: test
        language: system
        entry: sh -c 'npx jest --coverage=false'
        files: \.ts$
        pass_filenames: false
